# macOS 安装包云构建（GitHub Actions）
# 用法：把本工程推到 GitHub 仓库后：
#   1. 手动触发：仓库 Actions 页 → build-macos → Run workflow
#   2. 或推送 v 开头的 tag（如 v0.1.1）自动触发
# 构建完成后在运行页面的 Artifacts 下载 macos-dmg（内含 .dmg 安装包）
# 注：未做签名/公证（内部使用），安装时用 README 中的 Gatekeeper 绕过方法

name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存编译依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kiosk-client/src-tauri

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 macOS dmg
        working-directory: kiosk-client
        run: cargo tauri build --bundles dmg

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            kiosk-client/src-tauri/target/release/bundle/dmg/*.dmg
            kiosk-client/src-tauri/target/release/bundle/macos/*.app
