# macOS 安装包云构建（GitHub Actions）
# 用法：把本工程推到 GitHub 仓库后：
#   1. 手动触发：仓库 Actions 页 → build-macos → Run workflow
#   2. 或推送 v 开头的 tag（如 v0.1.1）自动触发
# 构建完成后在运行页面的 Artifacts 下载 macos-dmg（内含 .dmg 安装包）
# 注：未做签名/公证（内部使用），安装时用 README 中的 Gatekeeper 绕过方法

name: build-macos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存编译依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 macOS dmg
        run: cargo tauri build --bundles dmg

      # ad-hoc 自签：有签名的 app 才会有「仍要打开」入口，完全未签名会被报"已损坏"且无绕过选项
      - name: Ad-hoc 自签并重打 dmg
        run: |
          set -e
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          echo "DMG file: $DMG"
          MOUNT=/tmp/kiosk-mount
          rm -rf "$MOUNT" /tmp/signed-app signed-app
          mkdir -p "$MOUNT" /tmp/signed-app
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse
          echo "--- dmg 卷内容 ---"
          ls -la "$MOUNT"
          APP_SRC=$(find "$MOUNT" -maxdepth 2 -name "*.app" | head -n 1)
          echo "App found: $APP_SRC"
          cp -R "$APP_SRC" /tmp/signed-app/
          hdiutil detach "$MOUNT"
          APP_NAME=$(basename "$APP_SRC")
          codesign --force --deep -s - "/tmp/signed-app/$APP_NAME"
          codesign --verify --deep --strict "/tmp/signed-app/$APP_NAME"
          echo "签名校验通过: $APP_NAME"
          cp -R /tmp/signed-app ./signed-app
          hdiutil create -volname "Elecbalance Kiosk" -srcfolder /tmp/signed-app -ov -format UDZO src-tauri/target/release/bundle/dmg/Elecbalance-Kiosk-signed.dmg

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            src-tauri/target/release/bundle/dmg/Elecbalance-Kiosk-signed.dmg
            signed-app/*.app
