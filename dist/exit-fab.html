<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>退出考试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; user-select: none; }
    button {
      /* 固定 48px，与 Mac 按钮视觉尺寸一致；窗口更大且透明，只看到这个圆 */
      width: 48px;
      height: 48px;
      border: none;
      outline: none;
      border-radius: 50%;
      background: #169e8c;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    button:hover { background: #128672; }
    button svg { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <button id="fab" title="退出考试">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/>
      <path d="M15 16l4-4-4-4"/>
      <path d="M19 12H9"/>
    </svg>
  </button>
  <script>
    const { invoke } = window.__TAURI__.core;
    document.getElementById('fab').addEventListener('click', () => invoke('show_exit_confirm'));
  </script>
</body>
</html>
