<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>退出考试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: flex-end; justify-content: flex-end; padding: 14px; user-select: none; }
    button {
      width: 62px;
      height: 62px;
      border: none;
      border-radius: 50%;
      background: rgba(22, 158, 140, 0.94);
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      transition: transform 0.15s, background 0.15s;
    }
    button:hover { transform: scale(1.06); background: #128672; }
    button span { font-size: 11px; line-height: 1; }
  </style>
</head>
<body>
  <button id="fab" title="退出考试">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/>
      <path d="M15 16l4-4-4-4"/>
      <path d="M19 12H9"/>
    </svg>
    <span>退出考试</span>
  </button>
  <script>
    const { invoke } = window.__TAURI__.core;
    document.getElementById('fab').addEventListener('click', () => invoke('show_exit_confirm'));
  </script>
</body>
</html>
