<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>退出考试确认</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f4f7f6;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      width: 380px;
      background: #fff;
      border: 1px solid #dce7e3;
      border-radius: 12px;
      padding: 26px 26px 22px;
      box-shadow: 0 8px 28px rgba(15, 78, 64, 0.12);
    }
    h2 { font-size: 16px; font-weight: 500; color: #0f6e56; margin-bottom: 16px; }
    p { font-size: 13px; line-height: 1.8; color: #435c56; margin-bottom: 22px; }
    .btns { display: flex; gap: 10px; }
    button {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .cancel { background: #e8edeb; color: #45524d; }
    .ok { background: #169e8c; color: #fff; }
    .cancel:hover { background: #dce6e2; }
    .ok:hover { background: #128672; }
  </style>
</head>
<body>
  <div class="card">
    <h2>温馨提示</h2>
    <p>退出考试后，当前操作成绩将上传后台且不可更改，您是否确定退出？</p>
    <div class="btns">
      <button class="cancel" id="cancel">取消</button>
      <button class="ok" id="ok">确定退出</button>
    </div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const okBtn = document.getElementById('ok');
    const resetOk = () => { okBtn.disabled = false; };

    // 该窗口退出时只是 hide、webview 复用，不会重新加载页面。
    // 每次重新显示（focus / visibilitychange）都复位确定按钮，防止上次点击后
    // 遗留的 disabled 状态让第二次点击完全没反应。
    window.addEventListener('focus', resetOk);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) resetOk();
    });
    resetOk();

    document.getElementById('cancel').addEventListener('click', () => invoke('cancel_exit_exam'));
    okBtn.addEventListener('click', async () => {
      // 不用 disabled 做长等待锁：退出命令已异步化、很快返回，
      // 这里仅短暂置灰提供点击反馈，随后立即恢复，避免复用窗口时卡在禁用态。
      okBtn.disabled = true;
      try {
        await invoke('confirm_exit_exam');
      } catch (e) {
        console.error('confirm_exit_exam failed', e);
      } finally {
        setTimeout(resetOk, 200);
      }
    });
  </script>
</body>
</html>
